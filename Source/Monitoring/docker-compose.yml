services:
  grafana:
    image: grafana/grafana-enterprise:13.2.1-ubuntu
    container_name: grafana
    hostname: grafana
    restart: always
    user: root
    # env_file: .env
    ports:
      - '8098:3000'
    networks:
      - project_network
    volumes:
      - ./logs/grafana:/var/lib/grafana
      - ./grafana/plugins:/opt/grafana-plugins      
    environment:
      - TZ=Asia/Tehran
      - GF_PATHS_PLUGINS=/opt/grafana-plugins      

  cadvisor:
    image: cadvisor/cadvisor:v0.55.1
    container_name: cadvisor
    user: root
    hostname: cadvisor
    restart: unless-stopped
    # ports:
    #   - '8095:8080'
    networks:
      - project_network
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  node_exporter:
    image: prom/node-exporter:v1.3.1
    container_name: node_exporter
    user: root
    hostname: node_exporter
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
    # ports:
    #     - '8097:9100'
    networks:
      - project_network
    volumes:
      - '/:/host:ro'
    environment:
      - TZ=Asia/Tehran

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: prometheus
    hostname: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    # ports:
    #   - '9090:9090'
    restart: unless-stopped
    # env_file: .env
    user: root
    volumes:
      - ./prometheus:/etc/prometheus
      - ./logs/prometheus:/prometheus
    environment:
      - TZ=Asia/Tehran
    networks:
      - project_network

  akhq:
    image: tchiotludo/akhq:0.25.1
    user: root
    container_name: akhq
    hostname: akhq
    env_file: .env    
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            kafka:
              properties:
                bootstrap.servers: "${AKHQ_KAFKA_BROKER_IP}"
    ports:
      - '8099:8080'
    networks:
      - project_network

networks:
  project_network:
    external: true

